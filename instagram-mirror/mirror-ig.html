<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Elysium Clinic – Instagram Post Mirror 60x80</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: 600mm 800mm; margin: 0 }
  html,body{margin:0;padding:0;background:#fff}
  svg{display:block}
  .serif{font-family:'Playfair Display',serif}
  .script{font-family:'Great Vibes',cursive}
  .ui{font-family:'Inter',sans-serif}
</style></head>
<body>
<!-- 1 user unit = 1 mm. Mirror 600 x 800 mm, phone-shaped. -->
<svg id="m" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const q = new URLSearchParams(location.search);
const prod  = q.get('mode') === 'print';
const dark  = q.get('theme') === 'dark';
const svg = document.getElementById('m');
const part = q.get('part'); // 'top' | 'bottom' | null

// Preview gets a wall around the mirror; print is the exact 600x800 sheet.
const PAD = prod ? 0 : 90;
svg.setAttribute('viewBox', `${-PAD} ${-PAD} ${600+2*PAD} ${800+2*PAD}`);
if (prod) { svg.setAttribute('width','600mm'); svg.setAttribute('height','800mm'); }
else { svg.setAttribute('width', (600+2*PAD)*1.6); svg.setAttribute('height', (800+2*PAD)*1.6); }

const C = dark
  ? { panel:'#0d0d0f', text:'#f4ecdc', sub:'#b9a27a', icon:'#e2c487', accent:'url(#gold)', line:'#3a3226', heart:'url(#gold)' }
  : { panel:'#ffffff', text:'#141414', sub:'#6b6b6b', icon:'#1a1a1a', accent:'url(#gold)', line:'#e6e1d8', heart:'#e0245e' };

const R = 0;             // square corners
const TOP = 155, BOT = 615;   // clear mirror window from y=TOP to y=BOT

const star = (x,y,s,fill)=>`<path transform="translate(${x} ${y}) scale(${s})" fill="${fill}"
  d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z"/>`;

const defs = `<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8a6a2f"/><stop offset=".3" stop-color="#e9cf8f"/>
    <stop offset=".55" stop-color="#b8904a"/><stop offset=".8" stop-color="#f3dfa6"/><stop offset="1" stop-color="#9c7835"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2=".7" y2="1">
    <stop offset="0" stop-color="#d9dde2"/><stop offset=".5" stop-color="#b7bcc3"/><stop offset="1" stop-color="#9ea4ac"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#f9a825"/><stop offset=".5" stop-color="#e1306c"/><stop offset="1" stop-color="#c13584"/>
  </linearGradient>
  <radialGradient id="wall" cx=".5" cy=".45" r=".75">
    <stop offset="0" stop-color="#f1ece4"/><stop offset="1" stop-color="#d9d2c6"/>
  </radialGradient>
  <filter id="led" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
  <clipPath id="shape"><rect x="0" y="0" width="600" height="800" rx="${R}"/></clipPath>
</defs>`;

// ---------- icons (simple generic line icons, 1 unit ≈ 1 mm) ----------
const ic = (x,y,s,inner,sw=2.6)=>`<g transform="translate(${x} ${y}) scale(${s})" fill="none" stroke="${C.icon}" stroke-width="${sw/s}" stroke-linecap="round" stroke-linejoin="round">${inner}</g>`;
const heartPath = 'M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z';
const I = {
  heartFill: (x,y,s)=>`<path transform="translate(${x} ${y}) scale(${s})" d="${heartPath}" fill="${C.heart}"/>`,
  comment: (x,y,s)=>ic(x,y,s,'<path d="M20.5 11.5a8.5 8.5 0 1 1-4-7.2 8.5 8.5 0 0 1 4 7.2zM20.5 11.5 21.5 20.5 15.5 18"/>'),
  repost:  (x,y,s)=>ic(x,y,s,'<path d="M4 10V8a3 3 0 0 1 3-3h12M16 2l3 3-3 3M20 14v2a3 3 0 0 1-3 3H5M8 22l-3-3 3-3"/>'),
  send:    (x,y,s)=>ic(x,y,s,'<path d="M22 3 9.5 14.5M22 3l-7 18-3.5-7.5L3 10z"/>'),
  bookmark:(x,y,s)=>ic(x,y,s,'<path d="M19 21 12 16 5 21V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1z"/>'),
  home:    (x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z" fill="${C.icon}"/></g>`,
  reels:   (x,y,s)=>ic(x,y,s,'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3 8.5h18M8 3l3 5.5M14 3l3 5.5"/><path d="M10 12v5l4.5-2.5z" fill="'+C.icon+'"/>'),
  search:  (x,y,s)=>ic(x,y,s,'<circle cx="10.5" cy="10.5" r="7"/><path d="M16 16l5 5"/>'),
  plus:    (x,y,s)=>ic(x,y,s,'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>'),
  dots:    (x,y)=>[0,1,2].map(i=>`<circle cx="${x+i*7}" cy="${y}" r="1.9" fill="${C.icon}"/>`).join(''),
};

// Avatar with "story ring" + E monogram
// Logo badge: monogram over ELYSIUM / CLINIC wordmark on black, like the IG profile picture
const logo = (cx,cy,r)=>{
  const mh=r*1.08, mw=mh*585/765, ww=r*1.62, wh=ww*510/1650;
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#121010"/>
  <image href="logo-monogram.png" x="${cx-mw/2}" y="${cy-r*0.86}" width="${mw}" height="${mh}"/>
  <image href="logo-wordmark.png" x="${cx-ww/2}" y="${cy+r*0.22}" width="${ww}" height="${wh}"/>`;
};
const avatar = (cx,cy,r)=>`
  <circle cx="${cx}" cy="${cy}" r="${r+5.5}" fill="none" stroke="${dark?'url(#gold)':'url(#ring)'}" stroke-width="3.4"/>
  ${logo(cx,cy,r)}`;

// ---------- top panel ----------
const topPanel = `
  <rect x="0" y="0" width="600" height="${TOP}" fill="${C.panel}"/>
  <!-- status bar -->
  <text x="58" y="52" class="ui" font-weight="600" font-size="17" fill="${C.text}">10:51</text>
  <rect x="235" y="28" width="130" height="34" rx="17" fill="#0b0b0c" stroke="${dark?'#3a3226':'none'}" stroke-width="1"/>
  <g fill="${C.text}">
    <rect x="474" y="44" width="4" height="7" rx="1"/><rect x="480" y="40" width="4" height="11" rx="1"/>
    <rect x="486" y="36" width="4" height="15" rx="1"/><rect x="492" y="32" width="4" height="19" rx="1" opacity=".35"/>
  </g>
  ${ic(502,30,0.95,'<path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r=".8" fill="'+C.text+'"/>',2.4).replace(/stroke="[^"]+"/,'stroke="'+C.text+'"')}
  <rect x="530" y="34" width="26" height="14" rx="4" fill="none" stroke="${C.text}" stroke-width="1.6"/>
  <rect x="533" y="37" width="18" height="8" rx="2" fill="${C.text}"/>
  <rect x="557.5" y="38.5" width="2" height="5" rx="1" fill="${C.text}"/>
  <!-- profile row -->
  ${avatar(84,112,31)}
  <text x="136" y="108" class="ui" font-weight="600" font-size="21" fill="${C.text}">elysium_clinic</text>
  <text x="136" y="132" class="ui" font-weight="400" font-size="14" fill="${C.sub}">ELYSIUM Clinic | Bradford</text>
  ${I.dots(530,112)}
  <line x1="0" y1="${TOP-0.5}" x2="600" y2="${TOP-0.5}" stroke="${C.line}" stroke-width="1"/>`;

// ---------- bottom panel ----------
const botPanel = (()=>{ const y=BOT; return `
  <rect x="0" y="${y}" width="600" height="${800-y}" fill="${C.panel}"/>
  <line x1="0" y1="${y+0.5}" x2="600" y2="${y+0.5}" stroke="${C.line}" stroke-width="1"/>
  <!-- action row -->
  ${I.heartFill(44,y+12,1.35)}
  <text x="80" y="${y+37}" class="ui" font-weight="600" font-size="15" fill="${C.text}">2.3K</text>
  ${I.comment(128,y+14,1.2)}
  <text x="160" y="${y+37}" class="ui" font-weight="600" font-size="15" fill="${C.text}">128</text>
  ${I.repost(202,y+14,1.2)}
  <text x="234" y="${y+37}" class="ui" font-weight="600" font-size="15" fill="${C.text}">47</text>
  ${I.send(268,y+14,1.2)}
  <text x="300" y="${y+37}" class="ui" font-weight="600" font-size="15" fill="${C.text}">312</text>
  ${I.bookmark(526,y+14,1.2)}
  <!-- caption -->
  <text x="46" y="${y+68}" class="ui" font-size="15.5" fill="${C.text}">
    <tspan font-weight="600">elysium_clinic</tspan><tspan dx="6">Mirror, mirror on the wall…</tspan></text>
  <text id="cap" x="46" y="${y+90}" class="ui" font-size="15.5" fill="${C.text}">who’s glowing most of all?</text>
  <g id="capstar">${star(0,-5,0.6,'url(#gold)')}</g>
  <text x="46" y="${y+113}" class="ui" font-size="13.5" fill="${C.sub}">Snap a selfie, tag us &amp; get featured <tspan fill="${dark?'#e2c487':'#00376b'}">#ElysiumGlow #BradfordGlowUp</tspan></text>
  <!-- nav bar -->
  <line x1="0" y1="745" x2="600" y2="745" stroke="${C.line}" stroke-width="1"/>
  ${I.home(76,752,1.25)}
  ${I.search(165,752,1.25)}
  ${I.plus(270,752,1.25)}
  ${I.reels(375,752,1.25)}
  <circle cx="507" cy="767" r="16.5" fill="none" stroke="${C.icon}" stroke-width="1.8"/>
  ${logo(507,767,13.5)}`; })();

// ---------- assemble ----------
let out = defs;
if (!prod) {
  out += `<rect x="${-PAD}" y="${-PAD}" width="${600+2*PAD}" height="${800+2*PAD}" fill="url(#wall)"/>
          <rect x="-6" y="-6" width="612" height="812" rx="${R}" fill="#ffd98a" opacity=".9" filter="url(#led)"/>`;
}
out += `<g clip-path="url(#shape)">`;
if (!prod) {
  out += `<rect x="0" y="0" width="600" height="800" fill="url(#glass)"/>
          <rect x="60" y="-200" width="120" height="1200" fill="url(#sheen)" transform="rotate(-25 300 400)"/>
          <rect x="250" y="-200" width="40" height="1200" fill="url(#sheen)" transform="rotate(-25 300 400)"/>
          <text x="300" y="402" text-anchor="middle" class="ui" font-size="15" letter-spacing="5" fill="#fff" opacity=".7">LUSTRO</text>`;
} else {
  out += `<rect x="0" y="${TOP}" width="600" height="${BOT-TOP}" fill="none" stroke="#e5007e" stroke-width="0.5" stroke-dasharray="6 4"/>
          <text x="300" y="${(TOP+BOT)/2}" text-anchor="middle" class="ui" font-size="14" fill="#e5007e">OKNO LUSTRA – BEZ NADRUKU / CLEAR MIRROR – NO PRINT</text>
          <text x="300" y="${(TOP+BOT)/2+22}" text-anchor="middle" class="ui" font-size="11" fill="#e5007e">600 × 800 mm · narożniki proste · obrys różowy = linia cięcia (nie drukować)</text>`;
}
out += topPanel + botPanel + `</g>`;
out += `<rect x="${prod?0.3:0}" y="${prod?0.3:0}" width="${prod?599.4:600}" height="${prod?799.4:800}" rx="${R}" fill="none" stroke="${prod?'#e5007e':'#cfc6b6'}" stroke-width="${prod?0.5:2}"/>`;
if (prod && part) {
  // Separate strip: drop the full-sheet marks, keep artwork, add a cut line around the strip
  out = defs + `<g clip-path="url(#shape)">` + topPanel + botPanel + `</g>`;
  const y0 = part==='top' ? 0 : BOT, h = part==='top' ? TOP : 800-BOT;
  out += `<rect x="0.25" y="${y0+0.25}" width="599.5" height="${h-0.5}" fill="none" stroke="#e5007e" stroke-width="0.5"/>`;
  svg.setAttribute('viewBox', `0 ${y0} 600 ${h}`);
  svg.setAttribute('height', h+'mm');
  document.title = `strip ${part} 600x${h}`;
  const st=document.createElement('style'); st.textContent=`@page{size:600mm ${h}mm;margin:0}`; document.head.appendChild(st);
}
svg.innerHTML = out;
const placeStar = ()=>{ const b=document.getElementById('cap').getBBox();
  document.getElementById('capstar').setAttribute('transform',`translate(${b.x+b.width+10} ${b.y+b.height*0.62})`); };
placeStar(); document.fonts.ready.then(placeStar);
</script>
</body></html>
